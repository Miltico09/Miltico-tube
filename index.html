<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030408">
  <link rel="manifest" href="/manifest.json">
  <title>MILTICO TUBE // PRO HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030408;
      --card: rgba(12, 14, 26, 0.85);
      --border: rgba(0, 240, 255, 0.25);
      --blue: #00f0ff;
      --pink: #ff0055;
      --green: #00ff88;
      --text: #e2f8ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .hud-frame {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.03);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
    }
    .hud-frame::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--pink), var(--blue), var(--green));
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand-group h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #fff, var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-group span {
      font-size: 10px;
      color: #7a8c9e;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .status-pill {
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.35);
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      letter-spacing: 1px;
    }
    .badges-row {
      display: flex; gap: 6px; margin-bottom: 16px; justify-content: center;
    }
    .badge {
      font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: #6c7c8c;
      transition: all 0.2s ease;
    }
    .badge.active { border-color: var(--green); color: var(--green); background: rgba(0, 255, 136, 0.1); }

    .input-wrapper {
      position: relative; background: #060812; border: 1.5px solid var(--border);
      border-radius: 14px; padding: 6px; display: flex; align-items: center; margin-bottom: 14px;
      transition: all 0.3s ease;
    }
    .input-wrapper:focus-within { border-color: var(--green); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
    textarea {
      flex: 1; background: transparent; border: none; color: #fff;
      font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600;
      padding: 8px; outline: none; resize: none; height: 46px; width: 100%;
    }
    .btn-paste {
      background: rgba(0, 240, 255, 0.12); border: 1px solid var(--blue); color: var(--blue);
      font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap;
    }
    .controls-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; margin-bottom: 14px; }
    select, .mode-switcher {
      background: #060812; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; overflow: hidden; display: flex; align-items: center;
    }
    select { width: 100%; background: #060812; color: var(--blue); border: none; padding: 11px; font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; outline: none; }
    .mode-tab { flex: 1; background: transparent; border: none; color: #6c7c8c; padding: 11px 4px; font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
    .mode-tab.active { background: rgba(255, 0, 85, 0.15); color: #fff; border-bottom: 2px solid var(--pink); }

    .btn-execute {
      width: 100%; padding: 15px; background: linear-gradient(135deg, var(--blue), #0088ff);
      color: #030408; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900;
      border: none; border-radius: 14px; cursor: pointer; letter-spacing: 1.5px;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3); transition: 0.2s;
    }
    .btn-execute:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-execute:active:not(:disabled) { transform: scale(0.98); background: var(--green); }

    .status-box {
      margin-top: 14px; background: #060812; border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--blue); border-radius: 12px; padding: 12px; text-align: center; font-size: 13px; color: #8a9cb0;
      word-break: break-word;
    }
    .preview-card {
      display: none; margin-top: 14px; background: #070914; border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 14px; padding: 12px; text-align: left;
    }
    .video-container { width: 100%; margin-bottom: 10px; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--border); }
    video { width: 100%; max-height: 220px; display: block; }
    .filename-tag {
      background: #020306; border: 1px dashed rgba(0, 240, 255, 0.3); border-radius: 8px;
      padding: 6px 10px; margin: 8px 0; font-size: 12px; color: var(--green); font-family: monospace; display: flex; align-items: center; gap: 6px;
    }
    .filename-tag input { flex: 1; background: transparent; border: none; color: var(--green); font-family: monospace; font-size: 12px; outline: none; }
    .action-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .pro-btn {
      width: 100%; text-align: center; padding: 12px; background: var(--pink); color: #fff;
      text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
      border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }
    .pro-btn.alt { background: rgba(0, 240, 255, 0.12); border: 1px solid var(--blue); color: var(--blue); box-shadow: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid var(--blue);
      border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="hud-frame">
    <div class="top-bar">
      <div class="brand-group">
        <h1>MILTICO TUBE</h1>
        <span>PRO STREAM ENGINE</span>
      </div>
      <div class="status-pill">ONLINE</div>
    </div>

    <div class="badges-row">
      <span class="badge" id="b-yt">YOUTUBE</span>
      <span class="badge" id="b-tt">TIKTOK</span>
      <span class="badge" id="b-ig">REELS</span>
      <span class="badge" id="b-fb">FACEBOOK</span>
    </div>

    <div class="input-wrapper">
      <textarea id="urlInput" placeholder="Pega el enlace aquí..." oninput="detectarPlataforma()"></textarea>
      <button class="btn-paste" type="button" onclick="pegar()">PEGAR</button>
    </div>

    <div class="controls-grid">
      <select id="qualitySelect">
        <option value="max">🔥 MÁXIMA CALIDAD (4K/HD)</option>
        <option value="1080">🎬 1080p Full HD</option>
        <option value="720">⚡ 720p Rápido</option>
      </select>
      <div class="mode-switcher">
        <button class="mode-tab active" type="button" id="tabVid" onclick="setMode(false)">VÍDEO</button>
        <button class="mode-tab" type="button" id="tabAud" onclick="setMode(true)">MP3</button>
      </div>
    </div>

    <button class="btn-execute" type="button" id="btnExecute" onclick="procesarDescarga()">⚡ PROCESAR ARCHIVO</button>

    <div class="status-box" id="statusBox">
      SISTEMA EN LÍNEA // ESPERANDO ENLACE
    </div>

    <div class="preview-card" id="previewCard">
      <div class="video-container">
        <video id="videoPreview" controls playsinline referrerpolicy="no-referrer"></video>
      </div>
      <div style="font-size:13px; font-weight:700; color:#fff; margin-bottom:4px;" id="videoTitle">Título</div>
      <div class="filename-tag">
        <span>💾</span>
        <input type="text" id="customFilename" />
      </div>
      <div class="action-grid" id="actionButtons"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let isAudio = false;

    function setMode(audio) {
      isAudio = audio;
      document.getElementById('tabVid').classList.toggle('active', !isAudio);
      document.getElementById('tabAud').classList.toggle('active', isAudio);
    }

    function detectarPlataforma() {
      const val = document.getElementById('urlInput').value.toLowerCase();
      document.getElementById('b-yt').classList.toggle('active', val.includes('youtu'));
      document.getElementById('b-tt').classList.toggle('active', val.includes('tiktok'));
      document.getElementById('b-ig').classList.toggle('active', val.includes('instagram'));
      document.getElementById('b-fb').classList.toggle('active', val.includes('facebook') || val.includes('fb.'));
    }

    async function pegar() {
      try {
        const text = await navigator.clipboard.readText();
        const match = text.match(/https?:\/\/[^\s]+/);
        document.getElementById('urlInput').value = match ? match[0] : text.trim();
        detectarPlataforma();
      } catch {
        document.getElementById('statusBox').innerText = 'Mantén presionado el cuadro de texto para pegar manualmente';
      }
    }

    // Descarga directa desde el navegador para evitar el límite de 4.5 MB de Vercel en /api/stream
    async function descargarArchivo(url, extOverride) {
      const status = document.getElementById('statusBox');
      let name = document.getElementById('customFilename').value.trim() || 'video.mp4';
      if (extOverride) {
        name = name.replace(/\.[a-z0-9]+$/i, '') + '.' + extOverride;
      }

      try {
        status.innerHTML = '<span class="spinner"></span> Descargando flujo directo al dispositivo...';
        const response = await fetch(url, { referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error('CORS restringido en origen');

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        status.innerText = '✅ ¡Archivo guardado en tu dispositivo!';
      } catch {
        // Fallback: abrir el stream directamente en el navegador sin pasar por el proxy Serverless de 4.5 MB
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        status.innerText = '⚡ Flujo abierto directamente para guardar';
      }
    }

    async function procesarDescarga() {
      const input = document.getElementById('urlInput');
      const url = (input.value || '').match(/https?:\/\/[^\s]+/)?.[0] || '';
      const quality = document.getElementById('qualitySelect').value;
      const status = document.getElementById('statusBox');
      const preview = document.getElementById('previewCard');
      const btnExecute = document.getElementById('btnExecute');

      if (!url) {
        status.innerText = '⚠️ Pega un enlace válido primero';
        return;
      }

      preview.style.display = 'none';
      btnExecute.disabled = true;
      status.innerHTML = '<span class="spinner"></span> Procesando enlace...';

      const controller = new AbortController();
      const clientTimeout = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            mode: isAudio ? 'audio' : 'auto',
            quality
          }),
          signal: controller.signal
        });

        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          status.inner
