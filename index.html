<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06060e">
  <link rel="manifest" href="/manifest.json">
  <title>MILTICO TUBE // MAX HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060e;
      --card: rgba(14, 15, 28, 0.92);
      --blue: #00f0ff;
      --red: #ff0055;
      --green: #00ff88;
      --text: #e2f1ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.12) 0%, transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 14px;
    }
    .hud-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75), 0 0 25px rgba(0, 240, 255, 0.12);
      border-radius: 18px;
      width: 100%;
      max-width: 450px;
      padding: 22px 18px;
      position: relative;
      overflow: hidden;
    }
    .hud-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--red), var(--blue), var(--green));
    }
    .header { text-align: center; margin-bottom: 14px; }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 0;
      background: linear-gradient(90deg, #fff, var(--blue), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 12px;
      color: #8a99ad;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 3px;
      font-weight: 600;
    }
    .badges { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #778899; transition: 0.25s;
    }
    .badge.active {
      border-color: var(--green); color: var(--green);
      background: rgba(0, 255, 136, 0.12); box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
    }
    .input-box {
      display: flex; align-items: center; background: #080912;
      border: 1.5px solid rgba(0, 240, 255, 0.4); border-radius: 12px;
      padding: 4px; margin-bottom: 12px;
    }
    input {
      flex: 1; background: transparent; border: none; color: #fff;
      font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600;
      padding: 11px 10px; outline: none; width: 100%;
    }
    .btn-clear { background: transparent; border: none; color: var(--red); font-size: 18px; font-weight: bold; padding: 0 8px; cursor: pointer; display: none; }
    .btn-paste {
      background: rgba(0, 240, 255, 0.15); border: 1px solid var(--blue); color: var(--blue);
      font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
      padding: 10px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    }
    .options-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; margin-bottom: 14px; }
    .select-wrap, .mode-toggle {
      background: #080912; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px; display: flex; align-items: center; overflow: hidden;
    }
    select {
      width: 100%; background: #080912; color: var(--blue); border: none;
      padding: 10px; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; outline: none;
    }
    .mode-btn {
      flex: 1; background: transparent; border: none; color: #6c7a89;
      padding: 10px 4px; font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .mode-btn.active { background: rgba(255, 0, 85, 0.2); color: #fff; border-bottom: 2px solid var(--red); }
    .btn-main {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--blue), #00a2ff);
      color: #04050a; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 900;
      border: none; border-radius: 12px; cursor: pointer; letter-spacing: 1.5px;
      box-shadow: 0 5px 20px rgba(0, 240, 255, 0.35);
    }
    .status-panel {
      margin-top: 14px; background: rgba(6, 7, 15, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08); border-left: 3px solid var(--blue);
      border-radius: 10px; padding: 12px; text-align: center; font-size: 13px; font-weight: 600; color: #a0b2c6;
    }
    .preview-card {
      display: none; margin-top: 14px; background: #0a0b16;
      border: 1px solid rgba(0, 255, 136, 0.35); border-radius: 12px; padding: 12px; text-align: left;
    }
    .preview-top { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .preview-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1px solid var(--blue); }
    .preview-info { flex: 1; overflow: hidden; }
    .preview-title { font-size: 13px; font-weight: 700; color: #fff; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .filename-box {
      background: #05060c; border: 1px dashed rgba(0, 240, 255, 0.35);
      border-radius: 8px; padding: 7px 10px; margin-bottom: 10px; font-size: 12px; color: var(--green);
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .filename-box input { padding: 2px; font-size: 12px; color: var(--green); font-family: monospace; }
    .formats-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .dl-btn {
      width: 100%; text-align: center; padding: 11px 12px; background: var(--red); color: #fff;
      text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
      border-radius: 8px; border: none; cursor: pointer; display: block;
    }
    .dl-btn.alt { background: rgba(0, 240, 255, 0.14); border: 1px solid var(--blue); color: var(--blue); }
    .dl-btn.folder { background: rgba(0, 255, 136, 0.14); border: 1px solid var(--green); color: var(--green); }
    .loader {
      display: inline-block; width: 14px; height: 14px; border: 2px solid var(--blue);
      border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="hud-card">
    <div class="header">
      <h1 class="brand">MILTICO TUBE</h1>
      <div class="subtitle">Multi-Quality Stream Extractor</div>
    </div>

    <div class="badges">
      <span class="badge" id="b-yt">▶ YOUTUBE</span>
      <span class="badge" id="b-tt">♪ TIKTOK HD</span>
      <span class="badge" id="b-ig">◈ REELS</span>
      <span class="badge" id="b-fb">f FACEBOOK</span>
    </div>

    <div class="input-box">
      <input type="text" id="videoUrl" placeholder="Pega link de FB, IG Reel, TikTok, YT..." oninput="detectarRed()" />
      <button class="btn-clear" id="btnClear" onclick="limpiarInput()">✕</button>
      <button class="btn-paste" onclick="pegar()">📋 PEGAR</button>
    </div>

    <div class="options-grid">
      <div class="select-wrap">
        <select id="qualitySelect">
          <option value="max">🔥 CALIDAD: MAX (4K/1080p)</option>
          <option value="1080">🎬 CALIDAD: 1080p HD</option>
          <option value="720">⚡ CALIDAD: 720p Ligero</option>
        </select>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeVid" onclick="setMode(false)">🎬 VÍDEO</button>
        <button class="mode-btn" id="modeAud" onclick="setMode(true)">🎵 MP3</button>
      </div>
    </div>

    <button class="btn-main" onclick="descargar()">⚡ ANALIZAR Y DESCARGAR</button>

    <div class="status-panel" id="status">
      CARPETA PREFIJO: /Descargas/MilticoTube_...
    </div>

    <div class="preview-card" id="previewCard">
      <div class="preview-top">
        <img id="prevThumb" class="preview-thumb" src="https://cdn-icons-png.flaticon.com/512/724/724933.png" alt="thumb" />
        <div class="preview-info">
          <p class="preview-title" id="prevTitle">Descripción del vídeo</p>
          <div style="font-size:11px; color:var(--blue);" id="prevAuthor">@MilticoTube</div>
        </div>
      </div>

      <div class="filename-box">
        <span>📄</span>
        <input type="text" id="customFilename" title="Puedes editar el nombre antes de guardar" />
      </div>

      <div class="formats-list" id="actionBtns"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    let isAudio = false;
    let lastStreamUrl = '';

    function setMode(audioMode) {
      isAudio = audioMode;
      document.getElementById('modeVid').classList.toggle('active', !isAudio);
      document.getElementById('modeAud').classList.toggle('active', isAudio);
    }

    function limpiarUrl(texto) {
      const match = (texto || '').match(/https?:\/\/[^\s]+/);
      return match ? match[0] : texto.trim();
    }

    function detectarRed() {
      const val = document.getElementById('videoUrl').value.toLowerCase();
      document.getElementById('btnClear').style.display = val.length > 0 ? 'block' : 'none';
      document.getElementById('b-yt').classList.toggle('active', val.includes('youtu'));
      document.getElementById('b-tt').classList.toggle('active', val.includes('tiktok'));
      document.getElementById('b-ig').classList.toggle('active', val.includes('instagram'));
      document.getElementById('b-fb').classList.toggle('active', val.includes('facebook') || val.includes('fb.'));
    }

    function limpiarInput() {
      document.getElementById('videoUrl').value = '';
      detectarRed();
      document.getElementById('previewCard').style.display = 'none';
      document.getElementById('status').innerText = 'LISTO PARA NUEVA EXTRACCIÓN';
    }

    async function pegar() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('videoUrl').value = limpiarUrl(text);
        detectarRed();
      } catch (e) {
        document.getElementById('status').innerText = '⚠️ Mantén presionado el cuadro y toca Pegar';
      }
    }

    function obtenerNombreActual() {
      return document.getElementById('customFilename').value.trim() || `MilticoTube_${Date.now()}.mp4`;
    }

    async function forzarDescarga(url, customExt) {
      const status = document.getElementById('status');
      let finalName = obtenerNombreActual();
      if (customExt && !finalName.endsWith(customExt)) {
        finalName = finalName.replace(/\.[a-z0-9]+$/i, '') + '.' + customExt;
      }

      try {
        status.innerHTML = `<span class="loader"></span> Descargando <b>${finalName}</b>...`;
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = finalName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);
        status.innerHTML = `✅ Guardado como: <b>${finalName}</b>`;
      } catch (e) {
        status.innerHTML = '✅ Abriendo descarga directa del servidor...';
        window.open(url, '_blank');
      }
    }

    async function elegirCarpetaYGuardar(url) {
      const status = document.getElementById('status');
      const finalName = obtenerNombreActual();
      try {
        status.innerHTML = '<span class="loader"></span> Preparando archivo para carpeta MilticoTube...';
        const res = await fetch(url);
        const blob = await res.blob();

        // Si el navegador soporta selector nativo de carpetas o menú Guardar En de Android
        if (window.showSaveFilePicker) {
          const handle = await window.showSaveFilePicker({ suggestedName: finalName });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          status.innerHTML = `✅ Guardado en tu carpeta elegida: <b>${finalName}</b>`;
          return;
        }

        const file = new File([blob], finalName, { type: blob.type || 'video/mp4' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: finalName });
          status.innerHTML = `✅ Archivo enviado a tu gestor de carpetas/galería`;
          return;
        }
        forzarDescarga(url);
      } catch (e) {
        forzarDescarga(url);
      }
    }

    async function descargar() {
      const input = document.getElementById('videoUrl');
      const cleanUrl = limpiarUrl(input.value);
      input.value = cleanUrl;
      detectarRed();

      const quality = document.getElementById('qualitySelect').value;
      const status = document.getElementById('status');
      const preview = document.getElementById('previewCard');

      if (!cleanUrl.startsWith('http')) {
        status.innerText = '⚠️ Pega un enlace válido de FB, IG, TikTok o YT';
        return;
      }

      preview.style.display = 'none';
      status.innerHTML = '<span class="loader"></span> Desencriptando enlace y calidades...';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: cleanUrl, mode: isAudio ? 'audio' : 'auto', quality })
        });
        const data = await res.json();

        if (data.url) {
          lastStreamUrl = data.url;
          status.innerText = '✅ ¡Calidades y nombre generados!';
          preview.style.display = 'block';
          document.getElementById('prevTitle').innerText = data.title || 'Vídeo listo';
          document.getElementById('prevAuthor').innerText = data.author || 'Miltico Tube';
          document.getElementById('prevThumb').src = data.thumb || 'https://cdn-icons-png.flaticon.com/512/724/724933.png';
          document.getElementById('customFilename').value = data.filename || `MilticoTube_Video_${Date.now()}.mp4`;

          const btns = document.getElementById('actionBtns');
          let htmlBtns = `
            <button class="dl-btn" onclick="forzarDescarga('${data.url}')">⬇ DESCARGA RÁPIDA (${quality.toUpperCase()})</button>
            <button class="dl-btn folder" onclick="elegirCarpetaYGuardar('${data.url}')">📁 ELEGIR CARPETA / ENVIAR A GALERÍA</button>
          `;

          if (data.formats && data.formats.length > 1) {
            htmlBtns += `<div style="font-size:11px; color:#8a99ad; margin-top:6px;">OTRAS CALIDADES DISPONIBLES:</div>`;
            data.formats.forEach(f => {
              htmlBtns += `<button class="dl-btn alt" onclick="forzarDescarga('${f.url}', '${f.ext || 'mp4'}')">${f.label}</button>`;
            });
          }

          btns.innerHTML = htmlBtns;
          // Autodescarga inmediata con el nombre basado en la descripción
          forzarDescarga(data.url);
        } else {
          status.innerText = '❌ ' + (data.error || 'No se pudo extraer este enlace');
        }
      } catch (e) {
        status.innerText = '❌ Error de conexión con el servidor';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const shared = params.get('url') || params.get('text') || params.get('title') || '';
      const clean = limpiarUrl(shared);
      if (clean.startsWith('http')) {
        document.getElementById('videoUrl').value = clean;
        detectarRed();
        descargar();
      }
    });
  </script>
</body>
</html>
