<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#020307">
  <title>MILTICO TUBE // CYBER HUD v4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020307;
      --card: rgba(7, 10, 20, 0.84);
      --cyan: #00f0ff;
      --pink: #ff0055;
      --green: #00ff88;
      --yellow: #fcee0a;
      --text: #e6f9ff;
      --border-cyan: rgba(0, 240, 255, 0.42);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* CASCADA DE CÓDIGO CYBERPUNK */
    #cyberCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
    }

    /* REJILLA HOLOGRÁFICA Y LUCES DE FONDO */
    .cyber-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 85, 0.16) 0%, transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 26px 26px, 26px 26px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0, 0, 0, 0.28) 3px
      );
    }

    /* CONTENEDOR PRINCIPAL HUD */
    .hud-frame {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 455px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-cyan);
      border-radius: 18px;
      padding: 22px 18px 20px;
      box-shadow:
        0 0 35px rgba(0, 240, 255, 0.18),
        0 20px 60px rgba(0, 0, 0, 0.92),
        inset 0 0 25px rgba(0, 240, 255, 0.06);
      overflow: hidden;
      animation: framePulse 4.5s ease-in-out infinite alternate;
    }

    @keyframes framePulse {
      0% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 18px rgba(0, 240, 255, 0.04); }
      50% { box-shadow: 0 0 42px rgba(0, 240, 255, 0.28), 0 0 18px rgba(255, 0, 85, 0.18), inset 0 0 28px rgba(0, 240, 255, 0.08); }
      100% { box-shadow: 0 0 32px rgba(0, 255, 136, 0.22), inset 0 0 22px rgba(255, 0, 85, 0.06); }
    }

    /* LÁSER ESCÁNER ANIMADO */
    .hud-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      box-shadow: 0 0 14px var(--cyan);
      opacity: 0.7;
      animation: laserScan 5.5s linear infinite;
      pointer-events: none;
    }

    @keyframes laserScan {
      0% { top: -5%; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 105%; opacity: 0; }
    }

    /* ESQUINAS MECANIZADAS */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 12;
    }
    .corner.tl { top: 6px; left: 6px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .corner.tr { top: 6px; right: 6px; border-top: 2px solid var(--pink); border-right: 2px solid var(--pink); }
    .corner.bl { bottom: 6px; left: 6px; border-bottom: 2px solid var(--pink); border-left: 2px solid var(--pink); }
    .corner.br { bottom: 6px; right: 6px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

    /* BARRA DE LUCES LED PARPADEANTES */
    .telemetry-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: #6b889e;
      letter-spacing: 1px;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px dashed rgba(0, 240, 255, 0.22);
    }

    .led-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .led.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blinkFast 1.3s infinite; }
    .led.pink { background: var(--pink); box-shadow: 0 0 8px var(--pink); animation: blinkSlow 2.1s infinite; }
    .led.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blinkFast 0.85s infinite alternate; }
    .led.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); animation: blinkSlow 2.8s infinite; }

    @keyframes blinkFast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.18; transform: scale(0.8); }
    }
    @keyframes blinkSlow {
      0%, 70%, 100% { opacity: 1; }
      35% { opacity: 0.12; }
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand-group h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 2px 0 0 rgba(255, 0, 85, 0.6);
      animation: neonFlicker 6s infinite;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 0 0 12px rgba(0, 240, 255, 0.8), 2px 0 0 rgba(255, 0, 85, 0.6);
        opacity: 1;
      }
      20%, 24%, 55% {
        text-shadow: none;
        opacity: 0.72;
      }
    }

    .brand-group span {
      display: block;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .session-btn {
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid rgba(255, 0, 85, 0.5);
      color: #ff6699;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.8px;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.25);
    }
    .session-btn.active {
      background: rgba(255, 0, 85, 0.28);
      border-color: var(--pink);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.55);
    }

    .session-panel {
      display: none;
      background: rgba(3, 5, 12, 0.94);
      border: 1px solid rgba(255, 0, 85, 0.45);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .session-panel textarea {
      width: 100%;
      height: 44px;
      background: #020306;
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      resize: none;
      outline: none;
    }

    .badges-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 15px;
    }
    .badge {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      padding: 6px 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #5b7083;
      letter-spacing: 0.8px;
      transition: all 0.25s ease;
    }
    .badge.active {
      border-color: var(--green);
      color: var(--green);
      background: rgba(0, 255, 136, 0.14);
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.4), inset 0 0 8px rgba(0, 255, 136, 0.15);
    }

    .input-wrapper {
      position: relative;
      background: rgba(4, 7, 15, 0.92);
      border: 1.5px solid var(--border-cyan);
      border-radius: 12px;
      padding: 6px;
      display: flex;
      align-items: center;
      margin-bottom: 14px;
      transition: all 0.25s ease;
    }
    .input-wrapper:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.3);
    }
    textarea#urlInput {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13.5px;
      padding: 8px;
      outline: none;
      resize: none;
      height: 46px;
      width: 100%;
    }
    .btn-paste {
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.06));
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 11px 13px;
      border-radius: 9px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }
    .btn-paste:active {
      transform: scale(0.95);
      background: var(--cyan);
      color: #000;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 9px;
      margin-bottom: 16px;
    }
    select, .mode-switcher {
      background: rgba(4, 7, 15, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    select {
      width: 100%;
      color: var(--cyan);
      padding: 11px 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .mode-tab {
      flex: 1;
      background: transparent;
      border: none;
      color: #6c7c8c;
      padding: 11px 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-tab.active {
      background: rgba(255, 0, 85, 0.24);
      color: #fff;
      border-bottom: 2px solid var(--pink);
      text-shadow: 0 0 8px var(--pink);
    }

    .btn-execute {
      position: relative;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 55%, #ff0055 100%);
      background-size: 200% 200%;
      color: #020307;
      font-family: 'Orbitron', sans-serif;
      font-size: 13.5px;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 1.8px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.45);
      animation: gradientShift 4s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-execute:active:not(:disabled) {
      transform: scale(0.97);
    }
    .btn-execute:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status-box {
      margin-top: 14px;
      background: rgba(3, 6, 14, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-left: 3px solid var(--cyan);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: #9cb8d0;
      word-break: break-word;
    }

    .preview-card {
      display: none;
      margin-top: 14px;
      background: rgba(5, 9, 20, 0.95);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.15);
    }
    .video-container {
      width: 100%;
      margin-bottom: 10px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border-cyan);
    }
    video {
      width: 100%;
      max-height: 210px;
      display: block;
    }
    .filename-tag {
      background: #020306;
      border: 1px dashed rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      padding: 7px 10px;
      margin: 8px 0;
      font-size: 12px;
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filename-tag input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      outline: none;
    }
    .action-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 8px;
    }
    .pro-btn {
      width: 100%;
      text-align: center;
      padding: 13px;
      background: linear-gradient(90deg, var(--pink), #ff3377);
      color: #fff;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      border-radius: 9px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.45);
      display: block;
    }
    .pro-btn.alt {
      background: rgba(0, 240, 255, 0.14);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      box-shadow: none;
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid var(--cyan);
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <canvas id="cyberCanvas"></canvas>
  <div class="cyber-grid"></div>
  <div class="scanlines"></div>

  <div class="hud-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="telemetry-strip">
      <div class="led-cluster">
        <span class="led green"></span>
        <span class="led cyan"></span>
        <span class="led pink"></span>
        <span class="led yellow"></span>
        <span style="margin-left:4px; color:#00ff88;">SYS.NET // ONLINE</span>
      </div>
      <div>HUD v4.0 // ACTIVE</div>
    </div>

    <div class="top-bar">
      <div class="brand-group">
        <h1>MILTICO TUBE</h1>
        <span>CYBER STREAM ENGINE</span>
      </div>
      <button class="session-btn" type="button" id="sessionBtn" onclick="window.toggleSession()">🔐 SESIÓN META</button>
    </div>

    <div class="session-panel" id="sessionPanel">
      <div style="font-size:11px; color:#9cb8d0; margin-bottom:5px;">Cookie de Sesión (Opcional para Reels privados):</div>
      <textarea id="cookieInput" placeholder="sessionid=...; c_user=..."></textarea>
    </div>

    <div class="badges-row">
      <span class="badge" id="b-yt">YOUTUBE</span>
      <span class="badge" id="b-tt">TIKTOK</span>
      <span class="badge" id="b-ig">REELS</span>
      <span class="badge" id="b-fb">FACEBOOK</span>
    </div>

    <div class="input-wrapper">
      <textarea id="urlInput" placeholder="Pega el enlace aquí..." oninput="window.detectarPlataforma()"></textarea>
      <button class="btn-paste" type="button" id="btnPaste" onclick="window.pegar()">PEGAR</button>
    </div>

    <div class="controls-grid">
      <select id="qualitySelect">
        <option value="max">🔥 MÁXIMA CALIDAD (4K/HD)</option>
        <option value="1080">🎬 1080p Full HD</option>
        <option value="720">⚡ 720p Rápido</option>
      </select>
      <div class="mode-switcher">
        <button class="mode-tab active" type="button" id="tabVid" onclick="window.setMode(false)">VÍDEO</button>
        <button class="mode-tab" type="button" id="tabAud" onclick="window.setMode(true)">MP3</button>
      </div>
    </div>

    <button class="btn-execute" type="button" id="btnExecute" onclick="window.procesarDescarga()">⚡ DESCARGAR ARCHIVO</button>

    <div class="status-box" id="statusBox">
      SISTEMA EN LÍNEA // ESPERANDO ENLACE
    </div>

    <div class="preview-card" id="previewCard">
      <div class="video-container">
        <video id="videoPreview" controls playsinline referrerpolicy="no-referrer"></video>
      </div>
      <div style="font-size:13px; font-weight:700; color:#fff; margin-bottom:4px;" id="videoTitle">Título</div>
      <div class="filename-tag">
        <span>💾</span>
        <input type="text" id="customFilename" />
      </div>
      <div class="action-grid" id="actionButtons"></div>
    </div>
  </div>

  <script>
    // 1. Destruir cualquier caché o Service Worker antiguo que bloquee los botones
    (async function clearOldCache() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) await caches.delete(key);
        }
      } catch (e) {}
    })();

    // 2. Animación Cyberpunk de Cascada de Código en Canvas
    (function initCyberRain() {
      const canvas = document.getElementById('cyberCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height, columns, drops, colors, speeds;
      const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンABCDEF0123456789⚡';
      const palette = ['#00f0ff', '#00ff88', '#00f0ff', '#ff0055', '#00f0ff'];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const fontSize = 14;
        columns = Math.floor(width / fontSize);
        drops = Array.from({ length: columns }, () => Math.random() * -50);
        colors = Array.from({ length: columns }, () => palette[Math.floor(Math.random() * palette.length)]);
        speeds = Array.from({ length: columns }, () => 0.45 + Math.random() * 0.85);
      }

      window.addEventListener('resize', resize);
      resize();

      function render() {
        ctx.fillStyle = 'rgba(2, 3, 7, 0.12)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = '13px "Share Tech Mono", monospace';

        for (let i = 0; i < columns; i++) {
          if (i % 2 !== 0 && i % 5 !== 0) continue;
          const char = chars[Math.floor(Math.random() * chars.length)];
          const x = i * 14;
          const y = drops[i] * 14;

          if (Math.random() > 0.86) {
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = colors[i];
          } else {
            ctx.fillStyle = colors[i];
            ctx.shadowBlur = 0;
          }

          ctx.fillText(char, x, y);

          if (y > height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i] += speeds[i];
        }
        requestAnimationFrame(render);
      }
      render();
    })();

    // 3. Funciones Globales Ancladas a window para Máxima Compatibilidad Móvil
    window.isAudio = false;
    window.isProcessing = false;

    window.setMode = function(audio) {
      window.isAudio = audio;
      document.getElementById('tabVid').classList.toggle('active', !audio);
      document.getElementById('tabAud').classList.toggle('active', audio);
    };

    window.toggleSession = function() {
      const p = document.getElementById('sessionPanel');
      const b = document.getElementById('sessionBtn');
      const open = p.style.display === 'block';
      p.style.display = open ? 'none' : 'block';
      b.classList.toggle('active', !open);
    };

    window.detectarPlataforma = function() {
      const val = (document.getElementById('urlInput').value || '').toLowerCase();
      document.getElementById('b-yt').classList.toggle('active', val.includes('youtu'));
      document.getElementById('b-tt').classList.toggle('active', val.includes('tiktok'));
      document.getElementById('b-ig').classList.toggle('active', val.includes('instagram'));
      document.getElementById('b-fb').classList.toggle('active', val.includes('facebook') || val.includes('fb.'));
    };

    window.pegar = async function() {
      const input = document.getElementById('urlInput');
      const status = document.getElementById('statusBox');
      try {
        const text = await navigator.clipboard.readText();
        const match = text.match(/https?:\/\/[^\s]+/);
        input.value = match ? match[0] : text.trim();
        window.detectarPlataforma();
        status.innerText = '✅ Enlace pegado. Toca DESCARGAR ARCHIVO.';
      } catch (e) {
        input.focus();
        status.innerText = '⚠️ Mantén presionado el cuadro de texto y toca Pegar';
      }
    };

    window.descargarArchivo = async function(url, ext) {
      const status = document.getElementById('statusBox');
      let name = document.getElementById('customFilename').value.trim() || 'video.mp4';
      if (ext) name = name.replace(/\.[a-z0-9]+$/i, '') + '.' + ext;

      status.innerHTML = '<span class="spinner"></span> Iniciando transferencia al teléfono...';

      // Intento 1: Descarga directa por Blob si CORS lo permite
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 6000);
        const res = await fetch(url, { referrerPolicy: 'no-referrer', signal: ctrl.signal });
        clearTimeout(tid);

        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 1000) {
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
            status.innerText = '✅ ¡Descarga completada en tu dispositivo!';
            return;
          }
        }
      } catch (e) {}

      // Intento 2: Abrir descarga directa del servidor CDN
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      status.innerText = '⚡ Descarga directa iniciada en el navegador';
    };

    window.procesarDescarga = async function() {
      if (window.isProcessing) return;

      const input = document.getElementById('urlInput');
      const rawText = (input.value || '').trim();
      const urlMatch = rawText.match(/https?:\/\/[^\s]+/);
      const url = urlMatch ? urlMatch[0] : rawText;

      const quality = document.getElementById('qualitySelect').value;
      const cookieEl = document.getElementById('cookieInput');
      const cookie = cookieEl ? cookieEl.value.trim() : '';
      const status = document.getElementById('statusBox');
      const preview = document.getElementById('previewCard');
      const btn = document.getElementById('btnExecute');

      if (!url || !url.startsWith('http')) {
        status.innerText = '⚠️ Pega un enlace válido que empiece con http:// o https://';
        return;
      }

      window.isProcessing = true;
      preview.style.display = 'none';
      btn.disabled = true;
      status.innerHTML = '<span class="spinner"></span> Conectando con nodos de extracción...';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 18000);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: url,
            mode: window.isAudio ? 'audio' : 'auto',
            quality: quality,
            cookie: cookie
          }),
          signal: controller.signal
        });

        const textResponse = await res.text();
        let data;
        try {
          data = JSON.parse(textResponse);
        } catch (err) {
          status.innerText = `❌ Error en servidor (${res.status}). Verifica que subiste api/download.js correctamente.`;
          return;
        }

        if (res.ok && data && data.url) {
          status.innerText = '✅ ¡Stream extraído! Guardando...';
          preview.style.display = 'block';
          document.getElementById('videoTitle').innerText = data.title || 'Vídeo Extraído';
          document.getElementById('customFilename').value = data.filename || 'video.mp4';

          const videoEl = document.getElementById('videoPreview');
          videoEl.src = data.url;

          const actionContainer = document.getElementById('actionButtons');
          actionContainer.innerHTML = '';

          const mainBtn = document.createElement('button');
          mainBtn.type = 'button';
          mainBtn.className = 'pro-btn';
          mainBtn.textContent = '⬇ GUARDAR EN EL TELÉFONO';
          mainBtn.onclick = () => window.descargarArchivo(data.url);
          actionContainer.appendChild(mainBtn);

          const directLink = document.createElement('a');
          directLink.href = data.url;
          directLink.target = '_blank';
          directLink.rel = 'noopener noreferrer';
          directLink.className = 'pro-btn alt';
          directLink.textContent = '⚡ ABRIR ENLACE DIRECTO DEL VIDEO';
          actionContainer.appendChild(directLink);

          window.descargarArchivo(data.url);
        } else {
          status.innerText = '❌ ' + (data?.error || 'No se pudo extraer el vídeo');
        }
      } catch (e) {
        if (e.name === 'AbortError') {
          status.innerText = '❌ Tiempo agotado (18s). El servidor externo tardó demasiado.';
        } else {
          status.innerText = '❌ Error de conexión: ' + (e.message || 'Verifica tu red');
        }
      } finally {
        clearTimeout(timeoutId);
        window.isProcessing = false;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
